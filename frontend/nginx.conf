server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Limite de tamanho do corpo da requisição. O padrão do Nginx é 1 MB,
    # o que barrava o upload de imagens antes de chegar ao backend.
    # Fica acima do limite do multer (5 MB) para que a validação amigável
    # da API ("imagem muito grande") seja exibida em vez de um 413 do Nginx.
    client_max_body_size 6m;

    # ---- Proxy reverso para a API ----
    # O frontend chama caminhos como /api/auth/login e /api/ocorrencias.
    # A API real NÃO usa o prefixo /api (rotas são /auth, /ocorrencias),
    # então a barra final em "proxy_pass .../;" remove o /api do caminho:
    #   /api/auth/login  ->  http://backend:3100/auth/login
    # "backend" é o nome do serviço no docker-compose (DNS interno do Docker).
    location /api/ {
        proxy_pass http://backend:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Cache ----
    # O index.html NUNCA deve ser cacheado: é ele que aponta para o bundle
    # JS/CSS (com hash no nome). Sem isso, o navegador serve uma página
    # antiga e ignora o build novo (foi o que escondeu o botão de tema).
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Assets com hash no nome (index-ABC123.js) podem ser cacheados para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # O favicon pode mudar entre builds; um no-cache evita o cache teimoso.
    location = /favicon.svg {
        add_header Cache-Control "no-cache";
    }

    # ---- SPA fallback ----
    # Se o arquivo/pasta não existir, entrega o index.html para que o
    # React Router resolva a rota no cliente (evita 404 em refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
