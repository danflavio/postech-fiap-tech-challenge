server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Proxy reverso para a API ----
    # O frontend chama caminhos como /api/auth/login e /api/ocorrencias.
    # A API real NÃO usa o prefixo /api (rotas são /auth, /ocorrencias),
    # então a barra final em "proxy_pass .../;" remove o /api do caminho:
    #   /api/auth/login  ->  http://backend:3100/auth/login
    # "backend" é o nome do serviço no docker-compose (DNS interno do Docker).
    location /api/ {
        proxy_pass http://backend:3100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- SPA fallback ----
    # Se o arquivo/pasta não existir, entrega o index.html para que o
    # React Router resolva a rota no cliente (evita 404 em refresh).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
